    <!--

    -->

    <meta property="og:locale" content="es_CO" />
    <meta property="og:site_name" content="Yury Enríquez · Makeup Artist" />
    <meta property="og:title" content="Yury Enríquez · Maquilladora profesional en Pasto" />
    <meta property="og:description" content="Maquillaje y peinado para novias, quinceañeras, grados y sesiones de fotos en Pasto, Nariño. Reserva en línea o escríbeme por WhatsApp." />
    <meta property="og:url" content="https://www.yuryenriquezmakeup.com/" />
    <meta property="og:image" content="https://www.yuryenriquezmakeup.com/img/og-yury-1200x630.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Yury Enríquez maquillando a una clienta en su estudio, frente al aro de luz" />

    <meta name="twitter:title" content="Yury Enríquez · Maquilladora profesional en Pasto" />
    <meta name="twitter:description" content="Maquillaje y peinado para novias, quinceañeras, grados y sesiones de fotos en Pasto, Nariño. Reserva en línea o escríbeme por WhatsApp." />
    <meta name="twitter:image" content="https://www.yuryenriquezmakeup.com/img/og-yury-1200x630.jpg" />

    <!--
      Datos del negocio para Google. Solo lo confirmado: nombre, web, foto,
      ciudad e Instagram. El teléfono y la dirección se editan en el panel
      y no se repiten aquí, para que no queden dos versiones distintas.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "BeautySalon",
        "name": "Yury Enríquez · Makeup Artist",
        "description": "Maquillaje y peinado para novias, quinceañeras, grados y sesiones de fotos en Pasto, Nariño. Reserva en línea o escríbeme por WhatsApp.",
        "url": "https://www.yuryenriquezmakeup.com/",
        "image": "https://www.yuryenriquezmakeup.com/img/og-yury-1200x630.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Pasto",
          "addressRegion": "Nariño",
          "addressCountry": "CO"
        },
        "areaServed": { "@type": "City", "name": "Pasto" },
        "sameAs": ["https://www.instagram.com/yuryenriquez_makeupartist.psi/"]
      }
    </script>

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@400;500;600&family=Parisienne&display=swap"
      rel="stylesheet"
    />

    <title>Yury Enríquez · Maquilladora profesional en Pasto</title>
    <!-- Antes del script del tema: si no existe todavía, el script no la
         encuentra y la barra del celular sale beige en los temas oscuros. -->
    <meta name="theme-color" content="#E9E1D4" />

    <script>
      /*
       * Tema sin parpadeo.
       *
       * El tema real lo manda el servidor (Panel → Ajustes), pero esa
       * respuesta tarda unos milisegundos. Si esperáramos, quien entra
       * con el tema oscuro activo vería un fogonazo blanco. Aquí se
       * aplica de inmediato el último tema conocido, guardado en el
       * navegador, y en cuanto llega la respuesta de la API se corrige
       * si hiciera falta.
       *
       * Va en línea y antes del CSS a propósito: debe ejecutarse antes
       * del primer pintado.
       */
      (function () {
        try {
          var guardado = localStorage.getItem('tema-sitio');
          if (guardado === 'dark' || guardado === 'halloween') {
            document.documentElement.setAttribute('data-theme', guardado);
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute('content', guardado === 'halloween' ? '#16111B' : '#181512');
          }
        } catch (e) {
          /* Modo privado o almacenamiento bloqueado: se usa el tema claro. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
