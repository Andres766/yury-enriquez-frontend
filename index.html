<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Yury Enríquez · Makeup Artist. Maquillaje y peinado profesional para bodas, quinceañeros, grados, sesiones de fotos y eventos sociales. Reserva tu cita en línea."
    />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&family=Parisienne&display=swap"
      rel="stylesheet"
    />

    <title>Yury Enríquez · Makeup Artist</title>

    <script>
      /*
       * Tema sin parpadeo.
       *
       * El tema real lo manda el servidor (Panel → Ajustes), pero esa
       * respuesta tarda unos milisegundos. Si esperáramos, quien entra
       * con el tema oscuro activo vería un fogonazo blanco. Aquí se
       * aplica de inmediato el último tema conocido, guardado en el
       * navegador, y en cuanto llega la respuesta de la API se corrige
       * si hiciera falta.
       *
       * Va en línea y antes del CSS a propósito: debe ejecutarse antes
       * del primer pintado.
       */
      (function () {
        try {
          var guardado = localStorage.getItem('tema-sitio');
          if (guardado === 'dark' || guardado === 'halloween') {
            document.documentElement.setAttribute('data-theme', guardado);
            document
              .querySelector('meta[name="theme-color"]')
              ?.setAttribute('content', guardado === 'halloween' ? '#16111B' : '#181512');
          }
        } catch (e) {
          /* Modo privado o almacenamiento bloqueado: se usa el tema claro. */
        }
      })();
    </script>
    <meta name="theme-color" content="#E9E1D4" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
